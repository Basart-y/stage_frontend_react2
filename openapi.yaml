openapi: 3.0.3
info:
  title: Relais Smart API
  version: 1.0.0
paths:
  /api/v1/relay-points:
    get:
      summary: Rechercher les points relais ouverts
      parameters:
        - {in: query, name: city, schema: {type: string}}
        - {in: query, name: postalCode, schema: {type: string}}
        - {in: query, name: department, schema: {type: string}}
      responses:
        '200': {description: Liste des points relais}
        '401': {description: Non authentifié}
        '500': {description: Erreur interne}
  /api/v1/deliveries:
    get:
      summary: Lister les livraisons autorisées pour l'acteur connecté
      responses:
        '200': {description: Liste paginée}
    post:
      summary: Créer une livraison
      responses:
        '201': {description: Livraison créée}
        '400': {description: Entrée invalide}
        '403': {description: Action interdite}
components:
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: {type: string}
            message: {type: string}
            requestId: {type: string}
  /api/v1/geocoding/address:
    post:
      summary: Calculer les coordonnées d'un point relais depuis son adresse
      description: Route réservée au point relais connecté. Les coordonnées retournées restent modifiables dans le profil.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, city]
              properties:
                address: {type: string}
                postalCode: {type: string}
                city: {type: string}
                department: {type: string}
      responses:
        '200': {description: Coordonnées calculées}
        '400': {description: Adresse incomplète}
        '401': {description: Non authentifié}
        '403': {description: Rôle non autorisé}
        '404': {description: Adresse introuvable}
        '502': {description: Service de géocodage indisponible}
